# Build the site, with the latest Google Form submissions, and publish it to GitHub Pages.
#
# Runs when code is pushed to main, when the submissions Sheet's Apps Script reports a new or
# changed story, or by hand (Actions → Deploy → Run workflow, or `npm run deploy`).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer request waits rather than cancelling one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # If the Sheet can't be read, stop here so the live site keeps its submitted stories.
      - name: Import form submissions
        run: node scripts/import-form.mjs
      - name: Build
        run: npx vite build
        env:
          BASE_PATH: '' # served from the root of tsijournal.com
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
